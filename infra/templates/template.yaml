AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AINX Lambda Infrastructure

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: !Ref Stage
        LOG_LEVEL: INFO
    Tracing: Active

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - sit
      - staging
      - prod

Conditions:
  IsProd: !Equals [!Ref Stage, 'prod']

Mappings:
  StageConfig:
    dev:
      ReadMinCapacity: 1
      ReadMaxCapacity: 10
      WriteMinCapacity: 1
      WriteMaxCapacity: 5
    sit:
      ReadMinCapacity: 1
      ReadMaxCapacity: 10
      WriteMinCapacity: 1
      WriteMaxCapacity: 5
    staging:
      ReadMinCapacity: 1
      ReadMaxCapacity: 10
      WriteMinCapacity: 1
      WriteMaxCapacity: 5
    prod:
      ReadMinCapacity: 1
      ReadMaxCapacity: 10
      WriteMinCapacity: 1
      WriteMaxCapacity: 5

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
      TracingEnabled: true

  AgentRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ainx-agent-registration-${Stage}'
      Handler: index.handler
      CodeUri: ./functions/agent-registration/dist/
      Description: Agent registration Lambda function
      Environment:
        Variables:
          AGENT_REGISTRATION_TABLE_NAME: !Ref AgentRegistrationTable
          DID_UNIQUENESS_TABLE_NAME: !Ref DidUniquenessTable
          NONCE_TABLE_NAME: !Ref NonceTable
      Events:
        AgentRegistrationApi:
          Type: Api
          Properties:
            Path: /agents/register
            Method: POST
            RestApiId: !Ref ApiGateway
        RotateKeyApi:
          Type: Api
          Properties:
            Path: /agents/rotate-key
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource: 
                - !GetAtt AgentRegistrationTable.Arn
                - !Sub "${AgentRegistrationTable.Arn}/index/*"
                - !GetAtt DidUniquenessTable.Arn
                - !GetAtt NonceTable.Arn

  AgentRegistrationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ainx-agent-registration-errors-${Stage}'
      AlarmDescription: Alarm when agent-registration function error rate exceeds 1%
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentRegistrationFunction

  AgentRegistrationThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ainx-agent-registration-throttling-${Stage}'
      AlarmDescription: Alarm when agent-registration function is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentRegistrationFunction

  AgentRegistrationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ainx-agent-registration-${Stage}'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: did
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: did
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DidIndex
          KeySchema:
            - AttributeName: did
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      Tags:
        - Key: Project
          Value: AINX
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: agent-registration

  DidUniquenessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ainx-did-uniqueness-${Stage}'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: did
          AttributeType: S
      KeySchema:
        - AttributeName: did
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: AINX
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: agent-registration

  NonceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ainx-nonce-${Stage}'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: nonce
          AttributeType: S
      KeySchema:
        - AttributeName: nonce
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: AINX
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: agent-registration

  AgentRegistrationTableReadScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !FindInMap [StageConfig, !Ref Stage, ReadMaxCapacity]
      MinCapacity: !FindInMap [StageConfig, !Ref Stage, ReadMinCapacity]
      ResourceId: !Sub 'table/${AgentRegistrationTable}'
      RoleARN: !GetAtt DynamoDBAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      ServiceNamespace: dynamodb

  AgentRegistrationTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'ainx-agent-registration-read-scaling-${Stage}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AgentRegistrationTableReadScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0

  AgentRegistrationTableWriteScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !FindInMap [StageConfig, !Ref Stage, WriteMaxCapacity]
      MinCapacity: !FindInMap [StageConfig, !Ref Stage, WriteMinCapacity]
      ResourceId: !Sub 'table/${AgentRegistrationTable}'
      RoleARN: !GetAtt DynamoDBAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      ServiceNamespace: dynamodb

  AgentRegistrationTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'ainx-agent-registration-write-scaling-${Stage}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AgentRegistrationTableWriteScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0

  DidUniquenessTableReadScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !FindInMap [StageConfig, !Ref Stage, ReadMaxCapacity]
      MinCapacity: !FindInMap [StageConfig, !Ref Stage, ReadMinCapacity]
      ResourceId: !Sub 'table/${DidUniquenessTable}'
      RoleARN: !GetAtt DynamoDBAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      ServiceNamespace: dynamodb

  DidUniquenessTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'ainx-did-uniqueness-read-scaling-${Stage}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref DidUniquenessTableReadScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0

  DidUniquenessTableWriteScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !FindInMap [StageConfig, !Ref Stage, WriteMaxCapacity]
      MinCapacity: !FindInMap [StageConfig, !Ref Stage, WriteMinCapacity]
      ResourceId: !Sub 'table/${DidUniquenessTable}'
      RoleARN: !GetAtt DynamoDBAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      ServiceNamespace: dynamodb

  DidUniquenessTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'ainx-did-uniqueness-write-scaling-${Stage}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref DidUniquenessTableWriteScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0

  DynamoDBAutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDynamoDBFullAccess

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  
  AgentRegistrationFunctionArn:
    Description: Agent Registration Lambda function ARN
    Value: !GetAtt AgentRegistrationFunction.Arn
