AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AINX Lambda Infrastructure

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: !Ref Stage
        LOG_LEVEL: INFO
    Tracing: Active

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Conditions:
  IsProd: !Equals [!Ref Stage, 'prod']

Resources:
  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
      TracingEnabled: true

  # Hello World Lambda
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ainx-hello-world-${Stage}'
      Handler: index.handler
      CodeUri: ../functions/hello-world/dist/
      Description: Hello World Lambda function
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: /hello
            Method: GET
            RestApiId: !Ref ApiGateway
      Policies:
        - AWSLambdaBasicExecutionRole

  # User Service Lambda
  UserServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ainx-user-service-${Stage}'
      Handler: index.handler
      CodeUri: ../functions/user-service/dist/
      Description: User service Lambda function
      Events:
        UsersApi:
          Type: Api
          Properties:
            Path: /users
            Method: ANY
            RestApiId: !Ref ApiGateway
        UserApi:
          Type: Api
          Properties:
            Path: /users/{proxy+}
            Method: ANY
            RestApiId: !Ref ApiGateway
      Policies:
        - AWSLambdaBasicExecutionRole

  # CloudWatch Alarms
  HelloWorldErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ainx-hello-world-errors-${Stage}'
      AlarmDescription: Alarm when hello-world function has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref HelloWorldFunction

  UserServiceErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ainx-user-service-errors-${Stage}'
      AlarmDescription: Alarm when user-service function has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref UserServiceFunction

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  
  HelloWorldFunctionArn:
    Description: Hello World Lambda function ARN
    Value: !GetAtt HelloWorldFunction.Arn
  
  UserServiceFunctionArn:
    Description: User Service Lambda function ARN
    Value: !GetAtt UserServiceFunction.Arn
