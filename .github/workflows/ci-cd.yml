name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-southeast-1

jobs:
  # Detect which files changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      packages: ${{ steps.filter.outputs.packages }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            packages:
              - 'packages/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  # Lint and format check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # Type check
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Integration tests
  integration-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run integration tests
        run: npm run test:integration

  # Security scan
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Build affected functions
  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, unit-test]
    if: ${{ needs.detect-changes.outputs.functions == 'true' }}
    strategy:
      matrix:
        function: [agent-registration]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.function }}
        run: |
          cd functions/${{ matrix.function }}
          npm run build
          cd dist
          zip -r index.zip index.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.function }}-build
          path: functions/${{ matrix.function }}/dist/

  deploy-sit:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-registration-build
          path: functions/agent-registration/dist/

      - name: Update Lambda function code
        run: |
          FUNCTION_NAME="ainx-agent-registration-sit"
          ZIP_FILE="functions/agent-registration/dist/index.zip"
          
          echo "Updating Lambda function code..."
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://${ZIP_FILE}"

      - name: Create or update API Gateway
        run: |
          API_NAME="ainx-api-sit"
          FUNCTION_NAME="ainx-agent-registration-sit"
          STAGE_NAME="sit"
          
          # Get Lambda function ARN
          LAMBDA_ARN=$(aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Configuration.FunctionArn' --output text)
          
          # Check if API Gateway exists
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='$API_NAME'].id" --output text)
          
          if [ -z "$API_ID" ]; then
            echo "Creating API Gateway..."
            
            # Create REST API
            API_ID=$(aws apigateway create-rest-api --name "$API_NAME" --query 'id' --output text)
            
            # Get root resource id
            ROOT_RESOURCE_ID=$(aws apigateway get-resources --rest-api-id "$API_ID" --query 'items[?path=="/"].id' --output text)
            
            # Create /agents resource
            AGENTS_RESOURCE_ID=$(aws apigateway create-resource --rest-api-id "$API_ID" --parent-id "$ROOT_RESOURCE_ID" --path-part "agents" --query 'id' --output text)
            
            # Create /register resource
            REGISTER_RESOURCE_ID=$(aws apigateway create-resource --rest-api-id "$API_ID" --parent-id "$AGENTS_RESOURCE_ID" --path-part "register" --query 'id' --output text)
            
            # Create POST method
            aws apigateway put-method --rest-api-id "$API_ID" --resource-id "$REGISTER_RESOURCE_ID" --http-method POST --authorization-type NONE
            
            # Create Lambda integration
            aws apigateway put-integration --rest-api-id "$API_ID" --resource-id "$REGISTER_RESOURCE_ID" --http-method POST --type AWS_PROXY --integration-http-method POST --uri "arn:aws:apigateway:${{ env.AWS_REGION }}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations"
            
            # Create deployment
            aws apigateway create-deployment --rest-api-id "$API_ID" --stage-name "$STAGE_NAME"
            
            # Add Lambda permission for API Gateway
            aws lambda add-permission --function-name "$FUNCTION_NAME" --statement-id apigateway-invoke --action lambda:InvokeFunction --principal apigateway.amazonaws.com --source-arn "arn:aws:execute-api:${{ env.AWS_REGION }}:$(aws sts get-caller-identity --query Account --output text):${API_ID}/*/POST/agents/register" || true
            
            echo "API Gateway created: https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/${STAGE_NAME}"
          else
            echo "API Gateway already exists: $API_ID"
          fi
          
          echo "API_GATEWAY_ID=$API_ID" >> $GITHUB_ENV

