name: CI/CD Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-southeast-1

jobs:
  # Detect which files changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      packages: ${{ steps.filter.outputs.packages }}
      infra: ${{ steps.filter.outputs.infra }}
      function-matrix: ${{ steps.build-matrix.outputs.function-matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            packages:
              - 'packages/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'
          list-files: json

      - name: Build function matrix
        id: build-matrix
        run: |
          changed_files='${{ steps.filter.outputs.functions_files }}'
          python3 scripts/build-function-matrix.py "$changed_files"

  # Lint and format check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # Type check
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: |
          cd packages/connection-utils && npm run build
          cd ../crypto-utils && npm run build
          cd ../did-utils && npm run build
          cd ../logger && npm run build
          cd ../shared-utils && npm run build

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: |
          cd packages/connection-utils && npm run build
          cd ../crypto-utils && npm run build
          cd ../did-utils && npm run build
          cd ../logger && npm run build
          cd ../shared-utils && npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Integration tests
  integration-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: |
          cd packages/connection-utils && npm run build
          cd ../crypto-utils && npm run build
          cd ../did-utils && npm run build
          cd ../logger && npm run build
          cd ../shared-utils && npm run build

      - name: Run integration tests
        run: npm run test:integration

  # Security scan
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Build affected functions
  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, unit-test]
    if: ${{ needs.detect-changes.outputs.functions == 'true' && needs.detect-changes.outputs.function-matrix != '[]' }}
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.function-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: |
          cd packages/connection-utils && npm run build
          cd ../crypto-utils && npm run build
          cd ../did-utils && npm run build
          cd ../logger && npm run build
          cd ../shared-utils && npm run build

      - name: Build ${{ matrix.function }}
        run: |
          cd functions/${{ matrix.function }}
          npm run build
          cd dist
          zip -r index.zip index.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.function }}-build
          path: functions/${{ matrix.function }}/dist/

  deploy-sit:
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.function-matrix != '[]'
    environment: sit
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.function-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download ${{ matrix.function }} build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.function }}-build
          path: functions/${{ matrix.function }}/dist/

      - name: Deploy ${{ matrix.function }} Lambda to SIT
        run: |
          ./scripts/deploy-lambda.sh \
            ainx-${{ matrix.function }}-sit \
            functions/${{ matrix.function }}/dist/index.zip

  deploy-sit-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-sit]
    if: github.event_name == 'pull_request'
    environment: sit
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API Gateway to sit stage
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='ainx-api-sit'].id" --output text)
          if [ -n "$API_ID" ]; then
            aws apigateway create-deployment \
              --rest-api-id $API_ID \
              --stage-name sit
            echo "API Gateway deployed to sit stage"
          else
            echo "Error: API Gateway not found"
            exit 1
          fi

  sit-e2e-test:
    runs-on: ubuntu-latest
    needs: [deploy-sit-gateway]
    if: github.event_name == 'pull_request'
    environment: sit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API Gateway URL
        id: get-api-url
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='ainx-api-sit'].id" --output text)
          if [ -n "$API_ID" ]; then
            API_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/sit"
            echo "API_URL=$API_URL" >> $GITHUB_ENV
            echo "api_url=$API_URL" >> $GITHUB_OUTPUT
            echo "API Gateway URL: $API_URL"
          else
            echo "Error: API Gateway not found"
            exit 1
          fi

      - name: Run E2E tests
        run: |
          echo "Running E2E tests against $API_URL"
          npm install
          npx jest --config jest.e2e.config.js --runInBand
        env:
          API_GATEWAY_URL: ${{ env.API_URL }}
          REGISTER_URL: ${{ env.API_URL }}

