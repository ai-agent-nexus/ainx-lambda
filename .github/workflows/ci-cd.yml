name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-southeast-1

jobs:
  # Detect which files changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      packages: ${{ steps.filter.outputs.packages }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            packages:
              - 'packages/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  # Lint and format check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # Type check
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Integration tests
  integration-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run integration tests
        run: npm run test:integration

  # Security scan
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Build affected functions
  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, unit-test]
    if: ${{ needs.detect-changes.outputs.functions == 'true' }}
    strategy:
      matrix:
        function: [agent-registration]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.function }}
        run: |
          cd functions/${{ matrix.function }}
          npm run build
          cd dist
          zip -r index.zip index.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.function }}-build
          path: functions/${{ matrix.function }}/dist/

  deploy-sit:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        function: [agent-registration]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.function }}-build
          path: functions/${{ matrix.function }}/dist/

      - name: List downloaded files
        run: |
          echo "Contents of functions/${{ matrix.function }}/dist/:"
          ls -la functions/${{ matrix.function }}/dist/

      - name: Deploy ${{ matrix.function }} to SIT
        run: |
          FUNCTION_NAME="ainx-${{ matrix.function }}-sit"
          ZIP_FILE="functions/${{ matrix.function }}/dist/index.zip"
          
          echo "Deploying ${{ matrix.function }} to SIT..."
          
          # Check if function exists
          if aws lambda get-function --function-name "$FUNCTION_NAME" > /dev/null 2>&1; then
            # Update existing function
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb://${ZIP_FILE}"
          else
            echo "Function $FUNCTION_NAME does not exist. Skipping..."
            echo "Note: First-time deployment requires manual creation via SAM/Console"
          fi

